<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="theme-color" content="#0d1117">
<title>本地 AI 助手</title>
<style>
  :root{
    /* 整体提亮 + 提高对比：原来的 #0b0f14 太黑、#8b96a5 太灰，长时间看很累 */
    --bg:#151a22; --bg2:#191f28; --panel:#20272f; --panel2:#28303b;
    --border:#333c4a; --border2:#414c5e;
    --text:#e9eef5; --dim:#a7b2c0; --dim2:#7c8794;
    --accent:#5aa9ff; --accent2:#3d8ae8; --accent-soft:rgba(90,169,255,.16);
    --ok:#4ecb62; --warn:#e0a92f; --err:#ff6b63;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:
    radial-gradient(1200px 600px at 50% -20%, #1c2939 0%, transparent 55%), var(--bg);
    color:var(--text);font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;border-bottom:1px solid var(--border);
    background:rgba(21,27,35,.86);backdrop-filter:blur(12px);
    position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.2px;font-size:15px}
  /* 左上角忙闲状态（问 CGI ?status=1，判据与提交互斥一致） */
.stat{font-size:11px;color:#7d8b9e;margin-left:6px;letter-spacing:.2px}
.stat.busy{color:#fbbf24}
.stat.idle{color:#4ade80}
.stat.unknown{color:#6b7a8d}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim2);flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(95,107,122,.16);transition:.3s}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.18)}
  .dot.load{background:var(--warn);box-shadow:0 0 0 3px rgba(210,153,34,.18);animation:pulse 1.3s infinite}
  .dot.err{background:var(--err);box-shadow:0 0 0 3px rgba(248,81,73,.18)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;
    background:var(--panel2);border:1px solid var(--border);color:var(--dim);font-size:11.5px;
    max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag b{color:var(--text);font-weight:500}
  .ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;
    border-radius:9px;background:var(--panel2);border:1px solid var(--border);color:var(--dim);
    cursor:pointer;transition:.16s}
  .ibtn:hover{background:#212a35;border-color:var(--border2);color:var(--text)}
  .ibtn:active{transform:scale(.94)}
  .ibtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}

  /* 不要用 scroll-behavior:smooth：agent 每 1.5s 轮询更新，
     平滑滚动动画会被一次次打断，永远滚不到底（表现为"锁在顶部"） */
  main{flex:1;overflow-y:auto;padding:22px 18px 10px}
  main::-webkit-scrollbar{width:8px}
  main::-webkit-scrollbar-thumb{background:#2a3542;border-radius:4px}
  main::-webkit-scrollbar-track{background:transparent}

  .msg{display:flex;margin-bottom:18px;gap:11px;align-items:flex-start;
    animation:rise .28s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .who{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center;
    font-size:12.5px;font-weight:700;background:var(--panel2);border:1px solid var(--border);
    color:var(--dim)}
  .msg.user{flex-direction:row-reverse}
  .msg.user .who{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent;color:#fff}
  .bubble{max-width:min(80%,660px);padding:11px 15px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--border);white-space:pre-wrap;
    word-break:break-word;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(0,0,0,.22)}
  .msg.user .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-color:transparent;color:#fff;border-bottom-right-radius:5px;
    box-shadow:0 2px 10px rgba(47,127,224,.22)}
  /* 字号三档：标准 / 大 / 特大。用 body class 覆盖关键字号，
     比全站 calc() 简单可靠；选择存 localStorage。 */
  body.fs-lg{font-size:17.5px}
  body.fs-lg .afinal{font-size:18px}
  body.fs-lg .astep-r{font-size:15px}
  body.fs-lg .astep-h{font-size:14.5px}
  body.fs-lg .astep-h code,body.fs-lg .chip,body.fs-lg .secs{font-size:13.5px}
  body.fs-lg .astat{font-size:13px}
  body.fs-xl{font-size:19px}
  body.fs-xl .afinal{font-size:19.5px}
  body.fs-xl .astep-r{font-size:16.5px}
  body.fs-xl .astep-h{font-size:15.5px}
  body.fs-xl .astep-h code,body.fs-xl .chip,body.fs-xl .secs{font-size:14.5px}
  body.fs-xl .astat{font-size:14px}
  /* 深色滚动条：默认的白色滚动条在深色主题上非常扎眼 */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2a3644;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#3c4c60}
  .msg.user .bubble{max-height:180px;overflow-y:auto}
  /* AI 气泡给个下限：纯 fit-content 时短内容会缩成一条，代码块/表格就挤扁了 */
  .msg.bot .bubble{border-bottom-left-radius:5px;min-width:min(380px,86%)}
  .bubble code{background:#0a0e13;border:1px solid var(--border);border-radius:5px;
    padding:1.5px 5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
  .bubble pre{position:relative;background:#0a0e13;border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;overflow-x:auto;margin:9px 0}
  .bubble pre code{background:none;border:0;padding:0;font-size:.87em;line-height:1.55}
  /* markdown 元素样式（表格/列表/标题/引用），之前只有裸文本 */
  .bubble table{border-collapse:collapse;margin:10px 0;font-size:14px}
  .bubble th,.bubble td{border:1px solid var(--border);padding:5px 10px;text-align:left}
  .bubble th{background:rgba(255,255,255,.055);font-weight:650;color:var(--text)}
  .bubble tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
  .bubble ul,.bubble ol{margin:8px 0;padding-left:23px}
  .bubble li{margin:3.5px 0}
  .bubble h3,.bubble h4,.bubble h5,.bubble h6{margin:11px 0 6px;
    font-size:15px;font-weight:650;color:var(--text);line-height:1.4}
  .bubble blockquote{margin:9px 0;padding:7px 13px;border-left:3px solid var(--border2);
    color:var(--dim);background:rgba(255,255,255,.022);border-radius:0 7px 7px 0}
  .bubble i{color:#c8d4e0}
  /* 代码高亮配色（One Dark 系） */
  .c-kw{color:#ff7ab2}                    /* 关键字 */
  .c-st{color:#a8e07a}                    /* 字符串 */
  .c-cm{color:#5d6b7a;font-style:italic}  /* 注释 */
  .bubble pre .copy{position:absolute;top:6px;right:6px;font-size:11px;padding:3px 8px;
    border-radius:6px;background:#1b222c;border:1px solid var(--border2);color:var(--dim);
    cursor:pointer;opacity:0;transition:.15s}
  .bubble pre:hover .copy{opacity:1}
  .bubble pre .copy:hover{color:var(--accent);border-color:var(--accent)}
  .bubble ul,.bubble ol{margin:6px 0;padding-left:20px}
  .bubble li{margin:3px 0}
  .caret{display:inline-block;width:7px;height:15px;vertical-align:-2px;
    background:var(--accent);animation:blink 1s steps(2) infinite;border-radius:1px}
  @keyframes blink{50%{opacity:0}}

  .typing{display:inline-flex;gap:4px;align-items:center;height:20px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.35;
    animation:dip 1.15s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes dip{0%,80%,100%{opacity:.28;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  .welcome{text-align:center;padding:46px 12px 24px;color:var(--dim);font-size:13.5px}
  .welcome .logo{width:56px;height:56px;margin:0 auto 16px;border-radius:17px;
    background:linear-gradient(140deg,rgba(74,158,255,.22),rgba(47,127,224,.06));
    border:1px solid rgba(74,158,255,.3);display:grid;place-items:center}
  .welcome .logo svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .welcome h3{margin:0 0 7px;font-size:18px;font-weight:650;color:var(--text);
    background:linear-gradient(90deg,#e8eef6,#9dc4ee);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  #heroTitle{cursor:pointer;transition:color .15s}
  #heroTitle:hover{color:#68e6b4}
  #heroTitle .pencil{font-size:.62em;opacity:0;margin-left:7px;
    color:#68e6b4;vertical-align:super;transition:opacity .15s}
  #heroTitle:hover .pencil{opacity:.9}
  .qask-mask{position:fixed;inset:0;background:rgba(3,8,12,.72);
    display:flex;align-items:center;justify-content:center;z-index:200;
    backdrop-filter:blur(3px)}
  .qask-box{width:min(560px,92vw);background:var(--panel);
    border:1px solid var(--border);border-radius:13px;padding:20px 22px;
    box-shadow:0 18px 48px rgba(0,0,0,.55)}
  .qask-box h4{margin:0 0 4px;font-size:15px;color:var(--text)}
  .qask-box p{margin:0 0 14px;font-size:12.5px;color:var(--dim)}
  .qask-box label{display:block;font-size:12.5px;color:var(--dim);margin:9px 0 4px}
  .qask-box input{width:100%;box-sizing:border-box;padding:8px 11px;
    background:#0b1418;border:1px solid var(--border);border-radius:7px;
    color:var(--text);font-size:13.5px;font-family:inherit}
  .qask-box input:focus{outline:none;border-color:#34d399}
  .qask-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:17px}
  .qask-foot button{padding:7px 17px;border-radius:7px;font-size:13px;
    cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
  .qask-foot .ok{background:linear-gradient(135deg,#34d399,#0ea371);
    color:#052e1f;border:none;font-weight:600}
  .chips{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{padding:8px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--border);
    color:var(--text);font-size:12.5px;cursor:pointer;transition:.16s;text-align:left;max-width:100%}
  .chip:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
  .chip:active{transform:none}

  footer{display:flex;gap:9px;align-items:flex-end;padding:11px 18px 14px;
    border-top:1px solid var(--border);background:rgba(21,27,35,.92);
    backdrop-filter:blur(12px);position:sticky;bottom:0;
    padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .inputwrap{flex:1;position:relative;display:flex;align-items:flex-end;gap:8px}
  .inputwrap > #upbtn{flex:none;width:38px;height:38px;margin-bottom:3px}
  #input{flex:1;resize:none;max-height:140px;min-height:44px;padding:11px 14px;
    border-radius:13px;border:1px solid var(--border);background:var(--panel2);
    color:var(--text);font:inherit;outline:none;transition:.18s;line-height:1.5;
    overflow-y:auto}
  #input::placeholder{color:var(--dim2)}
  #input:focus{border-color:rgba(74,158,255,.55);background:#0f151c;
    box-shadow:0 0 0 3px rgba(74,158,255,.1)}
  #send,#stop{border:0;border-radius:13px;font-weight:650;font-size:14px;cursor:pointer;
    color:#fff;transition:.16s;flex:0 0 auto;height:44px;padding:0 20px;
    display:inline-flex;align-items:center;gap:6px}
  #send svg,#stop svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  #send{background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 2px 12px rgba(47,127,224,.3)}
  #send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  #send:active:not(:disabled){transform:scale(.97)}
  #stop{background:linear-gradient(135deg,#f85149,#cf3030)}

  .hint{padding:0 18px 7px;font-size:10.5px;color:var(--dim2);text-align:center;letter-spacing:.3px}

  #scrollBtn{position:fixed;right:18px;bottom:86px;width:38px;height:38px;border-radius:50%;
    background:var(--panel2);border:1px solid var(--border2);color:var(--text);cursor:pointer;
    display:none;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:6;transition:.18s}
  #scrollBtn.show{display:grid}
  #scrollBtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

  .modebtn{
    padding:6px 12px;border-radius:8px;border:1px solid var(--border2);
    background:var(--panel2);color:var(--dim);font-size:12px;font-weight:600;
    cursor:pointer;transition:.16s;margin-right:2px;
  }
  .modebtn:hover{background:#222c38;color:var(--text)}
  /* Agent 用青绿系，跟对话模式的蓝色区分开，一眼能看出当前在执行什么 */
  .modebtn.on{background:linear-gradient(135deg,#34d399,#0ea371);
    border-color:transparent;color:#052e1f;box-shadow:0 2px 10px rgba(52,211,153,.32)}
  /* Agent 气泡：内容多，给足宽度（普通气泡是 fit-content，会缩成一条） */
  .bubble.agent-bubble{width:min(88%,760px);max-width:min(88%,760px)}
  .bubble.agent-bubble .agent-wrap{width:100%}
  .agent-wrap{display:flex;flex-direction:column;gap:7px;min-width:0;max-width:100%}
  .astep{background:linear-gradient(180deg,rgba(52,211,153,.06),rgba(52,211,153,.025));
    border:1px solid rgba(52,211,153,.24);border-radius:11px;padding:12px 15px;
    min-width:0;max-width:100%;overflow:hidden}
  .astep-h{display:flex;align-items:center;gap:9px;font-size:13.5px}
  .astep-h b{width:19px;height:19px;border-radius:50%;
    background:linear-gradient(135deg,#34d399,#0ea371);color:#052e1f;
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;
    flex:none;font-weight:800}
  .chip{background:rgba(52,211,153,.18);color:#6ee7b8;padding:2px 9px;
    border-radius:6px;font-size:12.5px;font-weight:650;
    font-family:ui-monospace,Menlo,monospace;
    border:1px solid rgba(52,211,153,.24)}
  .astep.streaming{border-style:dashed;border-color:rgba(251,191,36,.45);
    background:linear-gradient(180deg,rgba(251,191,36,.07),rgba(251,191,36,.02))}
  .astep.streaming .chip{background:#3a2f12;color:#fbbf24}
  .astep.streaming .chip:after{content:" ●";animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  .astep-h code{color:#a8e0cd;font-size:12.5px;background:#0d1a17;padding:2px 8px;
    border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    max-width:52%;font-family:ui-monospace,Menlo,monospace;
    border:1px solid rgba(52,211,153,.16)}
  .secs{margin-left:auto;color:#93a0ae;font-size:12.5px;flex:none;
    font-variant-numeric:tabular-nums}
  .astep-r{color:#b3c0cd;font-size:13.5px;line-height:1.72;margin-top:9px;
    white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;
    padding-left:9px;border-left:2px solid rgba(52,211,153,.28)}
  /* 推理/正文类内容完整展开，不折叠（数学推导被裁一半等于没有） */
  /* full = 内容完整展开（数学推导不能裁）。高度不限，但横向溢出
     必须在气泡内部滚 —— 以前是 overflow:visible，宽表格直接顶出卡片。 */
  .astep-r.full{max-height:none;overflow:auto;overflow-y:visible}
  .afinal{font-size:16.5px;line-height:1.85;color:var(--text);margin-top:7px;white-space:pre-wrap}
  /* 最终回答里的表格：分列对齐显示（"名称 | 数值"拼一行看不出来） */
  .afinal table{border-collapse:collapse;margin:8px 0;font-size:14.5px;
    white-space:normal;width:100%;table-layout:fixed}
  .afinal th,.afinal td{border:1px solid var(--border);padding:6px 10px;
    text-align:left;vertical-align:top;word-break:break-word}
  .afinal th{background:var(--panel2);font-weight:600;color:var(--dim)}
  .afinal td:first-child{width:72%}
  .afinal td:last-child,.afinal th:last-child{text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .astat{color:#8794a1;font-size:12px;text-align:right;
    font-variant-numeric:tabular-nums}
  .awarn{color:#efb44d;font-size:13px;background:rgba(239,180,77,.1);
    border-left:2px solid #efb44d;padding:7px 11px;border-radius:0 7px 7px 0}
  .dl{display:block;margin:8px 0 0 auto;font-size:11px;padding:3px 11px;
    border-radius:6px;background:rgba(52,211,153,.12);color:#5fe3b0;
    border:1px solid rgba(52,211,153,.26);cursor:pointer;font-family:inherit}
  .dl:hover{background:rgba(52,211,153,.2);color:#8ff0c8}
  .fdl{color:#5fe3b0;text-decoration:none;
    border-bottom:1px dashed rgba(52,211,153,.5);cursor:pointer}
  .fdl:hover{color:#8ff0c8;border-bottom-color:#8ff0c8}
  audio.ap{display:block;width:100%;max-width:400px;margin:8px 0 3px;
    height:34px;border-radius:8px}
  .err{color:var(--err)}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
    background:#222c38;border:1px solid var(--border2);color:var(--text);padding:10px 17px;
    border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.24s;z-index:20;
    box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:86vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:600px){
    header{padding:10px 13px}
    main{padding:16px 13px 6px}
    .bubble{max-width:84%}
    footer{padding:9px 13px;padding-bottom:calc(11px + env(safe-area-inset-bottom))}
    #send,#stop{padding:0 16px}
    .tag{max-width:120px}
    .welcome{padding:32px 8px 18px}
  }
/* 环境与插件面板（顶部按钮点开） */
.envpanel{position:fixed;top:52px;right:14px;z-index:60;display:none;
  min-width:270px;max-width:350px;max-height:70vh;overflow-y:auto;
  padding:11px 13px;border-radius:11px;background:#151c26;
  border:1px solid #24303f;box-shadow:0 14px 36px rgba(0,0,0,.6);
  font-size:12px;color:#c8d3e0}
.envpanel.show{display:block}
.envpanel h4{margin:0 0 7px;font-size:10.5px;color:#7d8b9e;font-weight:600;letter-spacing:.5px}
.envpanel .row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.envpanel .plist{display:flex;flex-direction:column;gap:5px}
.envpanel .pitem{padding:6px 9px;border-radius:7px;background:#101822;border:1px solid #1f2a38}
.envpanel .pitem b{color:#8ee6c8;font-size:11.5px;font-weight:600}
.envpanel .pitem span{display:block;color:#6b7a8d;font-size:10.5px;margin-top:2px;line-height:1.35}
/* 自动化插件：和被动工具区分开 */
.envpanel .pitem.auto{border-color:#2d5f52;background:#0e1d19}
.envpanel .pitem span.pill{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;
  font-size:9.5px;background:#243044;color:#8fb3ff;vertical-align:1px;font-weight:400}
.envpanel .pitem.auto span.pill{background:#164034;color:#6ee7b7}
.envpanel .trg{font-size:10px;color:#7b8ba0;margin-top:2px;font-family:monospace}
.envpanel .autoact{margin-top:6px;padding:2px 12px;border-radius:6px;cursor:pointer;
  font-size:11px;background:#1c3a30;color:#6ee7b7;border:1px solid #2d5f52}
.envpanel .autoact:hover{background:#245043}
.envpanel .autoact.bg{background:#182434;color:#8fb3ff;border-color:#2d415f;margin-left:6px}
.envpanel .autoact.bg:hover{background:#1f3049}
.envpanel .autoact.stop{background:#3a1d1d;color:#ff8f88;border-color:#5f2d2d}
.envpanel .autoact.stop:hover{background:#4a2424}
.envpanel .astate{margin-top:5px;font-size:11px}
.envpanel .astate.off{color:#6b7a8d}
.envpanel .astate.on{color:#4ade80}
/* 两类能力配色：底层运行时=蓝，专用库=紫，缺失=灰 */
.envpanel .chip.rt{color:#9ecbff;border-color:#27476b;background:#0f1b2a}
.envpanel .chip.rt i{background:#4d9bff;box-shadow:0 0 6px #4d9bff}
.envpanel .chip.lib{color:#c9b8ff;border-color:#453a6b;background:#171327}
.envpanel .chip.lib i{background:#a78bfa;box-shadow:0 0 6px #a78bfa}
.envpanel .chip.off{color:#5d6a7d;border-color:#2b3648;background:#0f141c}
.envpanel .chip.off i{background:#3a4557;box-shadow:none}
/* 环境 + LaTeX 公式（客户端渲染，不依赖外部库/CDN） */
.tex{font-family:"Latin Modern Math","Cambria Math","Times New Roman",serif;
  font-style:italic;white-space:nowrap}
.tex .frc{display:inline-flex;flex-direction:column;vertical-align:middle;
  text-align:center;font-size:.85em;line-height:1.08;margin:0 .15em}
.tex .frc .num{border-bottom:1px solid currentColor;padding:0 4px}
.tex .frc .den{padding:0 4px}
.tex .sqrt{white-space:nowrap}
.tex .sqrt .rad{border-top:1px solid currentColor;padding:0 3px;margin-left:-1px}
.texblk{text-align:center;margin:12px 0;font-size:16px;
  font-family:"Latin Modern Math","Cambria Math","Times New Roman",serif;font-style:italic}
.tex sup,.tex sub,.texblk sup,.texblk sub{font-size:.72em;font-style:normal}
/* 插件结果的附加信息（方程、解、天数这些小字） */
.pmeta{margin-top:5px;font-size:11.5px;color:var(--dim2);
  border-left:2px solid var(--border2);padding-left:7px}
.pmeta .err{color:var(--err)}
/* 步骤卡片里的表格（table 插件返回 markdown 表格，渲染出来要有网格） */
/* 表格宽度按内容走，别用 fixed —— 12 列均分宽度会把中文挤成每行 3 个字。
   列最少 80px、最多 320px，超了换行；整个表格超宽就横向滚动。 */
.astep-r table{border-collapse:collapse;margin:8px 0;font-size:13px;
  width:max-content;min-width:100%;table-layout:auto}
.astep-r th,.astep-r td{border:1px solid var(--border);padding:4px 8px;
  text-align:left;white-space:normal;word-break:break-word;
  min-width:80px;max-width:320px;vertical-align:top}
.astep-r th{background:var(--panel2);font-weight:600;color:var(--text)}
.astep-r .texblk{font-size:15px}
  /* 表格单独包一层：宽表格在表格自己身上滚，滚动条紧贴表格底边，
     不会被 31 行的内容推到气泡最下面（那样等于看不到滚动条）。 */
  /* 高度不能写死 440px：视口矮的时候容器底边跑到屏幕外，
     横向滚动条就永远看不到。用 55vh 封顶，滚动条始终在视野内。 */
  .tblwrap{overflow:auto;max-height:min(440px,55vh);max-width:100%;
    margin:8px 0;border:1px solid var(--border);border-radius:7px;
    scrollbar-width:thin;scrollbar-color:rgba(52,211,153,.55) rgba(255,255,255,.06)}
  .tblwrap table{margin:0;border:none}
  .tblwrap::-webkit-scrollbar{height:12px;width:12px;-webkit-appearance:none}
  .tblwrap::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:6px}
  .tblwrap::-webkit-scrollbar-thumb{background:rgba(52,211,153,.5);border-radius:6px;
    border:2px solid transparent;background-clip:content-box}
  .tblwrap::-webkit-scrollbar-thumb:hover{background:rgba(52,211,153,.55)}
  /* 气泡内的滚动条：细、深色、悬停才亮 */
  .astep-r::-webkit-scrollbar{height:9px;width:9px}
  .astep-r::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:5px}
  .astep-r::-webkit-scrollbar-thumb{background:rgba(52,211,153,.28);border-radius:5px}
  .astep-r::-webkit-scrollbar-thumb:hover{background:rgba(52,211,153,.5)}
  .astep-r{scrollbar-width:thin;scrollbar-color:rgba(52,211,153,.35) transparent}
</style>
</head>
<body>
<div id="app">
  <header>

  <main id="chat">

      <h3 id="heroTitle" title="点击自定义这 3 个快捷问题">板子上的本地 AI<span class="pencil">✎</span></h3>

             accept=".pdf,.docx,.doc,.xlsx,.xlsm,.pptx,.txt,.md,.csv,.json,.log">

<div id="toast"></div>

<script>
(function(){
  "use strict";
  /* 页面不含任何凭据：端口/模型名来自 /cgi-bin/llama，口令只存浏览器 localStorage */

  var el = function(id){ return document.getElementById(id); };
  var chat = el("chat"), input = el("input"), sendBtn = el("send"),
      stopBtn = el("stop"), dot = el("dot"), modelEl = el("model"),
      tpsEl = el("tps"), clearBtn = el("clear"), keyBtn = el("keybtn"),
      scrollBtn = el("scrollBtn");

  var CONF = { port: "", model: "", need_key: 0, enabled: 1 };
  var API = "";   // filled from /cgi-bin/llama, never hardcoded
  var KEY_STORE = "llama_key";
  var SYSTEM = "你是一个运行在路由器上的本地 AI 助手。用中文回答。" +
               "普通问答保持简洁；但用户要代码、脚本或详细步骤时，必须给出完整可运行的内容，" +
               "不要用「...」「略」跳过大段代码。" +
               "不会就直说不会，不要编造。" +
               "用户和你不是同一个人：用户说的「我」指用户自己。";

  var history = [], ctrl = null, busy = false, stickBottom = true;

  /* 字号三档：标准 → 大 → 特大，选择存 localStorage（换页也记得） */
  var FS_ORDER = ["md", "lg", "xl"];
  var fsState = localStorage.getItem("llama-fs") || "md";
  function applyFS(){
    document.body.classList.remove("fs-lg", "fs-xl");
    if (fsState === "lg") document.body.classList.add("fs-lg");
    if (fsState === "xl") document.body.classList.add("fs-xl");
    var fb = document.getElementById("fsbtn");
    if (fb) fb.textContent = fsState === "md" ? "A" : (fsState === "lg" ? "A+" : "A++");
  }
  applyFS();
  document.getElementById("fsbtn").addEventListener("click", function(){
    fsState = FS_ORDER[(FS_ORDER.indexOf(fsState) + 1) % FS_ORDER.length];
    localStorage.setItem("llama-fs", fsState);
    applyFS();
  });

  function toast(msg, ms){
    var t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove("show"); }, ms || 2200);
  }

  function esc(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  /* 流式渲染时每个 chunk 都会重跑一遍，只用最轻的几条；完整符号表留到收尾跑一次，
     否则 45 条正则 × 累积全文 = O(n^2)，低性能设备上会明显卡顿。 */
  /* 下标数字 → Unicode 下标（化学式 H_2O、数学 x_{12} 都用）
     只处理 _ 后跟数字，避免误伤 my_var 这种标识符。 */
  var SUBMAP = "₀₁₂₃₄₅₆₇₈₉";
  var SUPMAP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  function toSup(digits){
    return String(digits).split("").map(function(c){
      var n = +c;
      return isNaN(n) ? c : SUPMAP.charAt(n);
    }).join("");
  }
  function toSub(digits){
    return String(digits).split("").map(function(c){
      var n = +c;
      return isNaN(n) ? c : SUBMAP.charAt(n);
    }).join("");
  }

  function demathLight(s){
    return String(s)
      .replace(/\\\[|\\\]|\\\(|\\\)|\$\$/g, " ")
      .replace(/\\sqrt\s*\{([^{}]*)\}/g, function(m, inner){
        return /^[\w\u0370-\u03ff]$/.test(inner) ? "√" + inner : "√(" + inner + ")";
      })
      .replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, "($1)/($2)")
      .replace(/\\[a-zA-Z]+/g, "")
      .replace(/[{}]/g, "")
      .replace(/\^\{?-\}?/g, "⁻").replace(/\^\{?\+\}?/g, "⁺")
      .replace(/_\{?(\d+)\}?/g, function(m, d){ return toSub(d); });
  }

  /* 模型爱吐 LaTeX 且不再在 prompt 里花钱纠正它，全部在这里转成可读文本。
     不追求排版精度，只求"人能看懂、不留反斜杠"。 */
  function demath(s){
    return String(s)
      /* 定界符 / 环境 */
      .replace(/\\\[|\\\]|\\\(|\\\)|\$\$/g, " ")
      .replace(/\\begin\{[^}]*\}|\\end\{[^}]*\}/g, " ")
      /* 带参数的构造 */
      /* 根号：单字符直接 √x；多项内容必须加括号，否则 √x+y 分不清根号范围 */
      .replace(/\\sqrt\s*\[([^\]]*)\]\s*\{([^{}]*)\}/g, function(m, n, inner){
        return /^[\w\u0370-\u03ff]$/.test(inner) ? n + "√" + inner : n + "√(" + inner + ")";
      })
      .replace(/\\sqrt\s*\{([^{}]*)\}/g, function(m, inner){
        return /^[\w\u0370-\u03ff]$/.test(inner) ? "√" + inner : "√(" + inner + ")";
      })
      .replace(/\\sqrt\s*([0-9A-Za-z])/g, "√$1")
      .replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, "($1)/($2)")
      .replace(/\\[ntr]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, "($1)/($2)")
      .replace(/\\(?:text|mathrm|mathbf|mathit|operatorname)\s*\{([^{}]*)\}/g, "$1")
      /* 关系 / 运算 */
      .replace(/\\approx/g, "≈").replace(/\\neq|\\ne\b/g, "≠")
      .replace(/\\leq?/g, "≤").replace(/\\geq?/g, "≥")
      .replace(/\\ll\b/g, "≪").replace(/\\gg\b/g, "≫")
      .replace(/\\equiv/g, "≡").replace(/\\propto/g, "∝")
      .replace(/\\pm/g, "±").replace(/\\mp/g, "∓")
      .replace(/\\times/g, "×").replace(/\\div/g, "÷").replace(/\\cdot/g, "·")
      .replace(/\\int/g, "∫").replace(/\\sum/g, "Σ").replace(/\\prod/g, "∏")
      .replace(/\\partial/g, "∂").replace(/\\nabla/g, "∇").replace(/\\infty/g, "∞")
      .replace(/\\notin/g, "∉").replace(/\\in\b/g, "∈")
      .replace(/\\cup/g, "∪").replace(/\\cap/g, "∩").replace(/\\subset/g, "⊂")
      .replace(/\\leftrightarrow|\\Leftrightarrow/g, "↔").replace(/\\leftarrow/g, "←")
      .replace(/\\Rightarrow/g, "⇒").replace(/\\to\b|\\rightarrow/g, "→")
      /* 希腊字母 */
      .replace(/\\alpha/g, "α").replace(/\\beta/g, "β").replace(/\\gamma/g, "γ")
      .replace(/\\delta/g, "δ").replace(/\\epsilon/g, "ε").replace(/\\zeta/g, "ζ")
      .replace(/\\eta/g, "η").replace(/\\theta/g, "θ").replace(/\\kappa/g, "κ")
      .replace(/\\lambda/g, "λ").replace(/\\mu/g, "μ").replace(/\\nu/g, "ν")
      .replace(/\\xi/g, "ξ").replace(/\\pi\b/g, "π").replace(/\\rho/g, "ρ")
      .replace(/\\sigma/g, "σ").replace(/\\tau/g, "τ").replace(/\\phi/g, "φ")
      .replace(/\\chi/g, "χ").replace(/\\psi/g, "ψ").replace(/\\omega/g, "ω")
      .replace(/\\Gamma/g, "Γ").replace(/\\Delta/g, "Δ").replace(/\\Theta/g, "Θ")
      .replace(/\\Lambda/g, "Λ").replace(/\\Pi/g, "Π").replace(/\\Sigma/g, "Σ")
      .replace(/\\Phi/g, "Φ").replace(/\\Psi/g, "Ψ").replace(/\\Omega/g, "Ω")
      /* 排版命令残渣 */
      .replace(/\\(?:left|right|big|Big|bigg|Bigg)\s*/g, "")
      .replace(/\\[,;:!]/g, " ").replace(/\\q?quad/g, "  ")
      .replace(/\\ldots|\\cdots|\\dots/g, "…")
      .replace(/\^\{?2\}?/g, "²").replace(/\^\{?3\}?/g, "³").replace(/\^\{?n\}?/g, "ⁿ")
      /* 离子/电荷：e^- → e⁻、H^+ → H⁺（化学方程式必用） */
      .replace(/\^\{?-\}?/g, "⁻").replace(/\^\{?\+\}?/g, "⁺")
      .replace(/\^\{?(\d{1,2})\}?/g, function(d, m){ return toSup(m); })
      /* 下标：H_2O → H₂O、x_{12} → x₁₂（化学式和数学都常见）
       * 长度必须限制：化学式下标最多 3 位（C12H22O11），
       * 不限制的话文件名 multi_1795017919.xlsx 会被改成
       * multi₁₇₉₅₀₁₇₉₁₉.xlsx —— 用户看到的就是一排问号。 */
      .replace(/_\{?(\d{1,3})\}?/g, function(m, d){ return toSub(d); })
      /* 兜底：剩余命令与花括号 */
      .replace(/\\[a-zA-Z]+/g, "")
      .replace(/[{}]/g, "");
  }

  /* 轻量 markdown（够用就好）：表格 / 有序无序列表 / 标题 / 引用 / 粗斜体 / 行内代码 */
  function mdInline(t){
    var lines = String(t || "").split("\n");
    var out = [], i = 0;
    function inline(s){
      return s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
              .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
              .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
    }
    while (i < lines.length){
      var L = lines[i];
      /* 表格：首行 | a | b |，次行 |---|---| */
      if (/^\s*\|.*\|\s*$/.test(L) && i + 1 < lines.length
          && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
        var head = L.split("|").slice(1, -1).map(function(c){ return inline(c.trim()); });
        i += 2;
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
          rows.push(lines[i].split("|").slice(1, -1).map(function(c){ return inline(c.trim()); }));
          i++;
        }
        var h = "<table><thead><tr>";
        head.forEach(function(c){ h += "<th>" + c + "</th>"; });
        h += "</tr></thead><tbody>";
        rows.forEach(function(r){
          h += "<tr>";
          r.forEach(function(c){ h += "<td>" + c + "</td>"; });
          h += "</tr>";
        });
        out.push(h + "</tbody></table>");
        continue;
      }
      /* 无序列表 */
      if (/^\s*[-*+]\s+/.test(L)){
        var li1 = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){
          li1.push("<li>" + inline(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>");
          i++;
        }
        out.push("<ul>" + li1.join("") + "</ul>");
        continue;
      }
      /* 有序列表 */
      if (/^\s*\d+[.)]\s+/.test(L)){
        var li2 = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){
          li2.push("<li>" + inline(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>");
          i++;
        }
        out.push("<ol>" + li2.join("") + "</ol>");
        continue;
      }
      /* 标题 */
      var hd = L.match(/^(#{1,4})\s+(.*)$/);
      if (hd){
        var lv = Math.min(hd[1].length + 2, 6);
        out.push("<h" + lv + ">" + inline(hd[2]) + "</h" + lv + ">");
        i++;
        continue;
      }
      /* 引用（注意 esc() 已经把 > 转成了 &gt;） */
      if (/^\s*(&gt;|>)\s?/.test(L)){
        var qs = [];
        while (i < lines.length && /^\s*(&gt;|>)\s?/.test(lines[i])){
          qs.push(lines[i].replace(/^\s*(&gt;|>)\s?/, ""));
          i++;
        }
        out.push("<blockquote>" + inline(qs.join("<br>")) + "</blockquote>");
        continue;
      }
      out.push(inline(L));
      i++;
    }
    return out.join("\n");
  }

  /* 极简语法高亮（不引第三方库）。
     做法：先把字符串和注释摘成占位符，再给关键字染色，最后放回来 ——
     否则注释里的 import/def 也会被当关键字涂色，或者 span 标签自身被二次匹配。 */
  function hlCode(s){
    var store = [];
    function keep(cls, txt){
      store.push('<span class="' + cls + '">' + txt + '</span>');
      return "\u0000" + (store.length - 1) + "\u0000";
    }
    var t = s
      .replace(/(#[^\n]*)/g, function(m){ return keep("c-cm", m); })
      .replace(/(\/\/[^\n]*)/g, function(m){ return keep("c-cm", m); })
      /* 三引号 docstring 要排在普通字符串前面。
         坑：esc() 只转 & < >，双引号可能原样保留，也可能在别处成了 &quot; 实体，
         所以正则里两种形式都得认。 */
      .replace(/((?:"|&quot;){3}[\s\S]*?(?:"|&quot;){3}|(?:'|&#39;){3}[\s\S]*?(?:'|&#39;){3})/g,
               function(m){ return keep("c-st", m); })
      .replace(/((?:"|&quot;)[^\n]*?(?:"|&quot;)|'[^'\n]*')/g,
               function(m){ return keep("c-st", m); });
    t = t.replace(/\b(import|from|as|def|class|return|if|elif|else|for|while|try|except|finally|with|lambda|yield|raise|pass|break|continue|and|or|not|in|is|None|True|False|const|let|var|function|new|this|async|await|require|module|exports|package|public|private|static|void|int|float|double|bool|String|print)\b/g,
                  '<span class="c-kw">$1</span>');
    return t.replace(/\u0000(\d+)\u0000/g, function(_, i){ return store[+i]; });
  }

  /* ---------- LaTeX 公式（轻量渲染，纯客户端） ----------
     支持 $行内$ / $$块级$$、\frac、\sqrt、^{}、_{} 和常见符号。
     做法：先把 $...$ 抽成占位符再交给 markdown，最后还原 ——
     否则公式里的 * _ ^ 会被 markdown 当强调/下标改坏。 */
  var TEX_MAP = {
    alpha:'α', beta:'β', gamma:'γ', delta:'δ', epsilon:'ε', varepsilon:'ε',
    zeta:'ζ', eta:'η', theta:'θ', iota:'ι', kappa:'κ', lambda:'λ', mu:'μ',
    nu:'ν', xi:'ξ', pi:'π', rho:'ρ', sigma:'σ', tau:'τ', upsilon:'υ', phi:'φ',
    varphi:'φ', chi:'χ', psi:'ψ', omega:'ω',
    Gamma:'Γ', Delta:'Δ', Theta:'Θ', Lambda:'Λ', Pi:'Π', Sigma:'Σ',
    Phi:'Φ', Omega:'Ω', Psi:'Ψ',
    times:'×', div:'÷', pm:'±', mp:'∓', le:'≤', leq:'≤', ge:'≥', geq:'≥',
    ne:'≠', neq:'≠', approx:'≈', equiv:'≡', sim:'∼', propto:'∝',
    infty:'∞', cdot:'·', ldots:'…', dots:'…', cdots:'⋯',
    to:'→', rightarrow:'→', leftarrow:'←', Rightarrow:'⇒', Leftarrow:'⇐',
    leftrightarrow:'↔',
    sum:'∑', prod:'∏', int:'∫', iint:'∬', partial:'∂', nabla:'∇',
    angle:'∠', triangle:'△', perp:'⊥', parallel:'∥', because:'∵',
    therefore:'∴', degree:'°', prime:'′', circ:'∘',
    in:'∈', notin:'∉', subset:'⊂', supset:'⊃', cup:'∪', cap:'∩',
    empty:'∅', forall:'∀', exists:'∃', neg:'¬', land:'∧', lor:'∨'
  };

  function texBody(tex){
    var s = esc(tex);
    /* 分数（允许嵌套几层） */
    for (var i = 0; i < 3; i++) {
      s = s.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g,
        '<span class="frc"><span class="num">$1</span><span class="den">$2</span></span>');
    }
    /* 根号 */
    s = s.replace(/\\sqrt\[([^\]]*)\]\{([^{}]*)\}/g,
      '<span class="sqrt"><sup>$1</sup>√<span class="rad">$2</span></span>');
    s = s.replace(/\\sqrt\{([^{}]*)\}/g, '<span class="sqrt">√<span class="rad">$1</span></span>');
    s = s.replace(/\\sqrt/g, '√');
    /* 上下标 */
    s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/\^([\w.])/g, '<sup>$1</sup>');
    s = s.replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>').replace(/_([\w.])/g, '<sub>$1</sub>');
    /* 命令 → 符号；认不出的命令直接去掉反斜杠 */
    s = s.replace(/\\([a-zA-Z]+)/g, function(m, n){ return TEX_MAP[n] || n; });
    /* 排版指令扔掉 */
    s = s.replace(/\\(left|right|displaystyle|limits|quad|qquad|,|;|!| )/g, ' ');
    s = s.replace(/\\\\/g, ' ');
    s = s.replace(/[{}]/g, '');
    return s;
  }

  function protectMath(s){
    var store = [];
    /* 行内代码里的 $ 不是公式（比如 `awk '{print $1}'`），先保护起来 */
    s = s.replace(/`([^`\n]+)`/g, function(m, c){
      store.push('<code>' + esc(c) + '</code>');
      return "@@TEX" + (store.length - 1) + "@@";
    });
    s = s.replace(/\$\$([\s\S]+?)\$\$/g, function(m, t){
      store.push('<div class="texblk">' + texBody(t) + '</div>');
      /* 前后留空行：不然紧跟着的 markdown 表格会被粘到同一行，渲染不出来 */
      return "\n\n@@TEX" + (store.length - 1) + "@@\n\n";
    });
    s = s.replace(/\$([^$\n]{2,200}?)\$/g, function(m, t){
      store.push('<span class="tex">' + texBody(t) + '</span>');
      return "@@TEX" + (store.length - 1) + "@@";
    });
    return { text: s, store: store };
  }

  function restoreMath(html, store){
    /* 块级公式被 markdown 包成 <p>@@TEX0@@</p>，整段换掉（div 不能嵌在 p 里） */
    html = html.replace(/<p>\s*@@TEX(\d+)@@\s*<\/p>/g, function(_, i){ return store[+i] || ''; });
    return html.replace(/@@TEX(\d+)@@/g, function(_, i){ return store[+i] || ''; });
  }

  function render(text, withCopy, light){
    /* 先按 ``` 分块，再分别处理：
       代码块只做 HTML 转义 + 高亮，绝不跑 demath（那是给人话看的数学符号转换，
       会把代码里的 """、\\ 之类改坏）；普通文本才 demath + markdown。 */
    var parts = String(text || "").split(/```/);
    var html = "";
    for (var i = 0; i < parts.length; i++){
      if (i % 2 === 1){
        var body = parts[i].replace(/^[a-zA-Z0-9_+-]*\n/, "").replace(/\n$/, "");
        html += "<pre><code>" + hlCode(esc(body)) + "</code>" +
                (withCopy ? '<button class="copy">复制</button>' : "") + "</pre>";
      } else {
        /* 顺序很关键：先把 $...$ 抽成占位符，再跑 demath。
         * demath 会把 \frac{1}{2} 改写成 (1)/(2)，跑在它前面就毁了公式。 */
        var pm = protectMath(parts[i]);
        var plain = light ? demathLight(pm.text) : demath(pm.text);
        html += restoreMath(mdInline(esc(plain)), pm.store);
      }
    }
    return html;
  }
  window.render = render;          /* 方便控制台调试 */

  function nearBottom(){ return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 90; }
  /* 程序滚动 vs 用户滚动要分开：
     内容频繁增长时 scroll 事件也会触发，如果不屏蔽，
     nearBottom() 会把"内容变高了"误判成"用户往上滚了"，
     stickBottom 被置 false，之后就再也不跟随了。 */
  var progScroll = false;
  function scrollDown(force){
    if (!force && !stickBottom) return;
    progScroll = true;
    chat.scrollTop = chat.scrollHeight;
    requestAnimationFrame(function(){ progScroll = false; });
  }
  chat.addEventListener("scroll", function(){
    if (progScroll) return;              // 自己滚的，不算用户意图
    stickBottom = nearBottom();
    scrollBtn.classList.toggle("show", !stickBottom);
  });
  scrollBtn.addEventListener("click", function(){ chat.scrollTop = chat.scrollHeight; });
  function scrollDown(force){ if (force || stickBottom) chat.scrollTop = chat.scrollHeight; }

  chat.addEventListener("click", function(e){
    if (!e.target.classList || !e.target.classList.contains("copy")) return;
    var code = e.target.parentNode.querySelector("code");
    if (!code) return;
    var txt = code.textContent;
    var done = function(){ e.target.textContent = "已复制"; setTimeout(function(){ e.target.textContent = "复制"; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ legacyCopy(txt) && done(); });
    } else if (legacyCopy(txt)) done();
    else toast("复制失败，请手动选择");
  });
  function legacyCopy(txt){
    try {
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch(e){ return false; }
  }

  function addMsg(role, html){
    var w = el("welcome");
    if (w && w.parentNode) w.parentNode.removeChild(w);
    var row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "user" : "bot");
    var who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "我" : "AI";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (html) bubble.innerHTML = html;
    row.appendChild(who); row.appendChild(bubble);
    chat.appendChild(row);
    // 长消息（超过 max-height）默认滚到末尾：用户要看的是刚发的最后一段，
    // 停在开头会让人以为"卡住了 / 只有这么点"。
    if (role === "user" && bubble.scrollHeight > bubble.clientHeight) {
      bubble.scrollTop = bubble.scrollHeight;
    }
    scrollDown(true);
    return bubble;
  }

  function setState(cls, text){
    dot.className = "dot " + cls;
    if (text) modelEl.textContent = text;
  }
  function setTps(v){
    if (!v){ tpsEl.style.display = "none"; return; }
    tpsEl.style.display = "";
    tpsEl.innerHTML = "<b>" + v + "</b>";
  }

  /* ---------- 口令（只存在浏览器） ---------- */
  function storedKey(){ return localStorage.getItem(KEY_STORE) || ""; }
  function authHeaders(extra){
    var h = extra || {};
    var k = storedKey();
    if (k) h["Authorization"] = "Bearer " + k;
    return h;
  }
  function askKey(msg){
    var v = window.prompt(msg || "该服务设了访问口令，请输入（留空 = 清除）：", "");
    if (v === null) return false;
    if (v === "") localStorage.removeItem(KEY_STORE);
    else localStorage.setItem(KEY_STORE, v);
    return true;
  }

  /* ---------- 配置发现：端口/模型全部来自 UCI，页面不猜 ---------- */
  function loadConf(){
    return fetch("/cgi-bin/llama?_=" + Date.now(), {cache: "no-store"})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j || !j.ok){
          setState("err", "配置缺失");
          toast((j && j.error) ? j.error : "读不到 /etc/config/llama 的配置", 6000);
          return false;
        }
        CONF = j;
        API = location.protocol + "//" + location.hostname + ":" + CONF.port;
        if (CONF.model) modelEl.textContent = CONF.model;
        return true;
      })
      .catch(function(){
        setState("err", "配置缺失");
        toast("读不到 /cgi-bin/llama，检查 uhttpd 是否正常", 6000);
        return false;
      });
  }

  function probe(){
    fetch(API + "/health", {cache: "no-store", headers: authHeaders()})
      .then(function(r){
        if (r.status === 401){
          setState("err", "需要口令");
          if (!probe._asked){
            probe._asked = 1;
            if (askKey("服务开启了访问口令，请输入：")) setTimeout(probe, 300);
          }
          return null;
        }
        return r.json();
      })
      .then(function(j){
        if (!j) return;
        if (j.status === "ok"){
          setState("ok", CONF.model || "已就绪");
        } else {
          setState("load", "模型加载中…");
          setTimeout(probe, 3000);
        }
      })
      .catch(function(){
        setState("err", "服务未启动");
        if (!probe._warned){
          probe._warned = 1;
          toast("后端没响应：检查 llama-server 是否启用、端口是否对", 5000);
        }
        setTimeout(probe, 5000);
      });
  }

  /* ---------- 发送 ---------- */
  function autosize(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }
  input.addEventListener("input", autosize);

  function setBusy(b){
    busy = b;
    sendBtn.disabled = b;
    sendBtn.hidden = b;
    stopBtn.hidden = !b;
    input.disabled = b;
  }

  /* ---------- 对话 / Agent 双模式 ---------- */
  var MODE = "agent";        /* 默认就是 Agent 模式（按钮点亮） */

  (function initMode(){
    var btn = document.getElementById("modebtn");
    if (!btn) return;
    /* 先按当前 MODE 把按钮和输入框提示渲染好，避免初始状态与按钮文字对不上 */
    btn.textContent = (MODE === "agent") ? "Agent" : "对话";
    btn.classList.toggle("on", MODE === "agent");
    input.placeholder = (MODE === "agent")
      ? "给 Agent 一个任务，例如：看看 /tmp 下最大的文件"
      : "说点什么…（Enter 发送，Shift+Enter 换行）";
    btn.addEventListener("click", function(){
      MODE = (MODE === "chat") ? "agent" : "chat";
      btn.textContent = (MODE === "agent") ? "Agent" : "对话";
      btn.classList.toggle("on", MODE === "agent");
      input.placeholder = (MODE === "agent")
        ? "给 Agent 一个任务，例如：看看 /tmp 下最大的文件"
        : "说点什么…（Enter 发送，Shift+Enter 换行）";
      toast(MODE === "agent"
        ? "Agent 模式：能调用工具、多步执行（慢，一步 1-2 分钟）"
        : "已切回对话模式");
    });
  })();

  /* 输出里出现的文件名变成可下载链接；音频类直接给个播放器 */
  var FILE_RE = /([A-Za-z0-9_\u4e00-\u9fa5.\-]+\.(?:mid|midi|wav|mp3|ogg|pptx|py|md|txt|csv))/g;
  /* 给每个 table 套一层滚动容器（markdown 渲染器不负责布局） */
  function wrapTables(html){
    return String(html || "")
      .replace(/<table/g, '<div class="tblwrap"><table')
      .replace(/<\/table>/g, '</table></div>');
  }

  function linkFiles(html){
    return html.replace(FILE_RE, function(m){
      var href = "/cgi-bin/agent?file=" + encodeURIComponent(m);
      var link = '<a class="fdl" href="' + href + '" download>' + m + '</a>';
      if (/\.(wav|mp3|ogg)$/i.test(m)){
        return '<audio class="ap" controls preload="none" src="' + href +
               '"></audio>' + link;
      }
      return link;
    });
  }

  /* 把 agent 的文本日志转成步骤卡片，避免整块 <pre> 跟对话风格割裂 */
  /* 插件返回的是 JSON（{"value":...} / {"text":...} / {"value":"| 表格 |"}），
     直接 esc 出来就是一行 JSON，用户看不出内容。
     这里解出有意义的字段，表格/公式再交给 render 渲染。 */
  function pluginResultHtml(raw){
    var t = String(raw || "");
    if (/^\s*\{/.test(t)) {
      try {
        var j = JSON.parse(t);
        if (j.error) return '<span class="err">' + esc(j.error) + '</span>';
        var v = null, extra = [];
        if (j.value !== undefined) v = j.value;
        else if (j.answer !== undefined) v = j.answer;
        else if (j.text !== undefined) v = j.text;
        else if (j.factors !== undefined) v = "质因数：" + j.factors.join(" × ");
        else if (j.sections !== undefined) v = "(PPT 章节已生成，共 " + (j.sections.length || 0) + " 节)";
        else v = JSON.stringify(j, null, 1);

        if (j.eq) extra.push("方程 " + j.eq);
        if (j.values && j.values.length) extra.push("解 " + j.values.join(", "));
        else if (j.var && j.value !== undefined) extra.push(j.var + " = " + j.value);
        if (j.days !== undefined) extra.push("天数 " + j.days);
        if (j.kind) extra.push(j.kind);
        if (j.chars !== undefined) extra.push(j.chars + " 字符");

        var h = render(String(v), false, true);
        if (extra.length) h += '<div class="pmeta">' + esc(extra.join(" · ")) + '</div>';
        /* 有落盘文件就给个下载入口 —— 摘要只是一部分，完整数据要靠这个下载 */
        var dlpath = j.file || j.path;      /* jq 用 file，doc 用 path */
        if (dlpath){
          var fn = String(dlpath).split("/").pop();
          var sz = j.bytes ? "（" + (j.bytes > 1048576
                   ? (j.bytes / 1048576).toFixed(1) + " MB"
                   : Math.round(j.bytes / 1024) + " KB") + "）" : "";
          h += '<div class="pdl"><a class="fdl" href="/cgi-bin/agent?file='
             + encodeURIComponent(dlpath) + '" download>⬇ 下载 ' + esc(fn) + sz + '</a></div>';
        }
        return h;
      } catch (e) {
        /* 日志里这一行的 JSON 后面可能粘了下一段的标题
         * （"【接着导出 xlsx】"这种被当成续行追加进来），
         * 截到最后一个 } 再试一次，否则整张卡片只能显示原始 JSON。 */
        var cut = t.lastIndexOf("}");
        if (cut > 0) {
          try {
            var j2 = JSON.parse(t.slice(0, cut + 1));
            if (j2 && typeof j2 === "object") {
              var v2 = (j2.value !== undefined) ? j2.value
                     : (j2.answer !== undefined ? j2.answer : JSON.stringify(j2, null, 1));
              var h2 = render(String(v2), false, true);
              var dl2 = j2.file || j2.path;
              if (dl2){
                var fn2 = String(dl2).split("/").pop();
                h2 += '<div class="pdl"><a class="fdl" href="/cgi-bin/agent?file='
                    + encodeURIComponent(dl2) + '" download>⬇ 下载 ' + esc(fn2) + '</a></div>';
              }
              return h2;
            }
          } catch (e2) { /* 还是不行，原样显示 */ }
        }
      }
    }
    return render(t, false, true);
  }

  function renderAgentLog(text){
    var src = String(text || "");
    /* 自动化插件的输出没有「第 N 步 / 最终回答」这种结构，
     * 走下面的解析会被当成噪音丢掉。这类输出整段原样渲染，
     * 只滤掉框架自己的加载日志。 */
    var hasPluginLine = /^\s*\[[a-zA-Z_]+\]\s*\{/m.test(src);
    if (!hasPluginLine && src.indexOf('── 第') < 0 && src.indexOf('最终回答') < 0) {
      var clean = src.split("\n").filter(function(L){
        return !/^(已加载:|自动化:|跳过 |任务:|插件:)/.test(L);
      }).join("\n").replace(/^\s+|\s+$/g, "");
      if (!clean) clean = "（没有输出）";
      return wrapTables('<div class="agent-wrap"><div class="astep-r full">'
           + linkFiles(render(clean, false, true)) + '</div></div>');
    }
    var lines = String(text || "").split("\n");
    var steps = [], tail = [], cur = null;
    for (var i = 0; i < lines.length; i++){
      var L = lines[i].replace(/\s+$/, "");
      if (!L.trim()) continue;
      if (/^(任务:|模型:)/.test(L)) continue;
      var mStep = L.match(/^──\s*第\s*(\d+)\s*步\s*──/);
      if (mStep){ cur = null; continue; }   /* 只做分隔，卡片由后面的"模型"行创建 */
      /* 流式生成中的实时文本（3B 一句话要两分钟，不给进度等于卡死） */
      var mStream = L.match(/^模型正在生成[:：]\s*([\s\S]*)$/);
      if (mStream){
        if (!cur || cur.tool !== "生成中"){
          cur = {no:"…", tool:"生成中", arg:"实时输出", secs:""};
          steps.push(cur);
        }
        cur.result = mStream[1];
        continue;
      }
      if (/^模型\(\d+s\) 生成完毕/.test(L)){ cur = null; continue; }
      var mCall = L.match(/^模型\s*\(([\d.]+)s\)\s*:\s*([\s\S]*)$/);
      if (mCall){
        var raw = mCall[2];
        var mt = raw.match(/"tool"\s*:\s*"([a-zA-Z_]+)"/);
        var tname = mt ? mt[1].toLowerCase() : "…";
        /* final 不该显示成工具步骤，它的内容由下面的"最终回答"行负责 */
        if (tname === "final"){ cur = null; continue; }
        var ma = raw.match(/"(expr|path|cmd|question|content)"\s*:\s*"([^"]{0,60})/);
        cur = {no:String(steps.length + 1), tool:tname,
               arg: ma ? ma[2] : "", secs:mCall[1], result:""};
        steps.push(cur);
        continue;
      }
      var mRes = L.match(/^\s*\[([a-zA-Z_]+)\]\s*([\s\S]*)$/);
      if (mRes){
        var ntool = mRes[1].toLowerCase();
        /* [mem] 是框架的内存记账调试行，不是插件结果 */
        if (ntool === "mem") continue;
        /* 新卡片条件：
         *   1. 前面没有"模型(Ns)"行（框架预执行）
         *   2. 当前卡片已有内容、且插件名不同 —— 一次任务里框架可能连着输出
         *      两条（[jq] 出表格、[doc] 出 xlsx），以前后一条会覆盖前一条，
         *      用户看到的卡片内容就是错位的（表格卡片里显示 xlsx 的结论）。
         */
        if (!cur || (cur.result && cur.tool !== ntool)){
          cur = {no:String(steps.length + 1), tool:ntool,
                 arg:cur ? "框架续接" : "框架自动执行", secs:""};
          steps.push(cur);
        }
        cur.result = (cur.result ? cur.result + "\n" : "") + mRes[2].trim();
        continue;
      }
      if (/^最终回答/.test(L)){
        /* 多行答案要一直收到 [统计] 为止。否则 BOTTOM10 这种答案是
           "标题 + 10 行数据"，只取第一行就只剩个空标题 ——
           用户看到的正是"只有标题不展示数据"。 */
        var finLines = [L.replace(/^最终回答[^:]*:\s*/, "")];
        while (i + 1 < lines.length && !/^\[统计\]/.test(lines[i + 1])){
          i++;
          finLines.push(lines[i]);
        }
        tail.push({type:"final", text: finLines.join("\n")});
        continue;
      }
      if (/^\[统计\]/.test(L)){ tail.push({type:"stat", text:L}); continue; }
      if (/^(⚠|✗|!|↻|  ✗|  !|  ↻)/.test(L)){ tail.push({type:"warn", text:L.trim()}); continue; }
      /* 都不匹配的行：当作上一条工具结果的续行（多行输出很常见） */
      if (cur) cur.result += (cur.result ? "\n" : "") + L.trim();
    }

    var h = '<div class="agent-wrap">';
    for (var k = 0; k < steps.length; k++){
      var s = steps[k];
      h += '<div class="astep' + (s.tool === "生成中" ? " streaming" : "") + '">'
         + '<div class="astep-h"><b>' + esc(s.no) + '</b>';
      h += '<span class="chip">' + esc(s.tool) + '</span>';
      if (s.arg) h += '<code>' + esc(s.arg) + '</code>';
      if (s.secs) h += '<span class="secs">' + esc(s.secs) + 's</span>';
      h += '</div>';
      if (s.result){
        /* 推理/正文类内容不截太狠：math 的推导有 500 字，截 260 就等于没了。
           卡片本身有 max-height + 滚动，长内容能自己滚。 */
        /* 插件结果的展示长度：解题过程是 markdown 表格，几百字节很正常，
         * 截到 260 就等于把过程砍没了（用户看到"只有结果没有过程"）。
         * 卡片自己有 max-height + 滚动，不怕长。 */
        var limit = 4000;
        var r = s.result.length > limit ? s.result.slice(0, limit) + " …" : s.result;
        var full = " full";
        h += '<div class="astep-r' + full + '">' + linkFiles(pluginResultHtml(r)) + '</div>';
      }
      h += '</div>';
    }
    for (var j = 0; j < tail.length; j++){
      var o = tail[j];
      if (o.type === "final") h += '<div class="afinal">' + linkFiles(render(o.text, false)) + '</div>';
      else if (o.type === "stat") h += '<div class="astat">' + esc(o.text) + '</div>';
      else h += '<div class="awarn">' + esc(o.text) + '</div>';
    }
    if (!steps.length && !tail.length){
      h += '<div class="astep-r">' + esc(String(text || "（等待输出…）")) + '</div>';
    }
    /* 统一给表格套滚动容器：宽表格在表格自己身上滚，滚动条不会被
       几十行内容推到气泡最底下 */
    return wrapTables(h) + '</div>';
  }
  window.renderAgentLog = renderAgentLog;   /* 方便控制台调试/测试 */

  /* ===== 文件上传：纯文本模型读不了 PDF/Word/Excel =====
     上传时服务端就用 doc 插件转成 .txt，页面只记住文本路径；
     发任务时把路径塞进任务里，agent 用 read 工具读。 */
  var UPLOADS = [];                      // 本会话已上传的文本文件
  var fileInput = document.getElementById("fileinput");
  document.getElementById("upbtn").addEventListener("click", function(){
    fileInput.click();
  });
  fileInput.addEventListener("change", function(){
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    if (f.size > 20 * 1024 * 1024){ toast("文件太大（上限 20MB）"); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var b64 = String(fr.result).split(",")[1] || "";
      toast("上传并转换中… " + f.name, 60000);
      fetch("/cgi-bin/agent?upload=1", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name: f.name, data: b64})
      }).then(function(r){ return r.json(); })
        .then(function(j){
          if (!j.ok) throw new Error(j.error || "上传失败");
          UPLOADS.push({name: j.name, file: j.file, chars: j.chars, info: j.info});
          /* 标明这次是谁解析的：builtin=内置文本，plugin=doc 插件 */
          var how = j.builtin ? "内置文本"
                  : (j.plugin ? (j.plugin + " 插件解析") : "");
          var kindTxt = j.kind ? (" · " + j.kind) : "";
          addMsg("bot", '<div class="awarn">已上传 <b>' + esc(j.name) + '</b>（'
            + esc(kindTxt ? kindTxt.slice(3) : "文件") + '，' + j.chars + ' 字）'
            + (how ? '<br><span style="color:#7c8794;font-size:11px">解析方式：'
                     + esc(how) + '</span>' : '')
            + '<br>现在已经转成纯文本，可以直接让我总结 / 翻译 / 就内容提问。</div>');
          toast("");
          scrollDown(true);
        })
        .catch(function(e){ toast(e.message || "上传失败"); });
    };
    fr.readAsDataURL(f);
  });

  function uploadsRef(){
    if (!UPLOADS.length) return "";
    return "【用户已上传的文件（服务端已转成纯文本，用 read 工具读）】\n"
         + UPLOADS.map(function(u){ return u.file; }).join("\n")
         + "\n\n";
  }

  function runAgent(task){
    input.value = ""; autosize();
    addMsg("user", render(task, false));
    /* agent 的 JSON 约束会掐死数学推理：实测同一个 3B，纯对话能算对
       （长宽比5:2对角线29 → 面积290），进 agent 模式只会瞎编式子。
       检测到纯计算类任务就先提醒，别让用户白等五分钟。 */
    if (/计算|算一下|求解|解方程|面积|周长|体积|比例.*求|多少平方|多少立方/.test(task)
        && !/文件|目录|磁盘|系统|PPT|幻灯片|音乐|MIDI|下载|网页|抓/.test(task)) {
      addMsg("bot", '<div class="awarn">这类计算/推理题在 Agent 模式下容易算错'
        + '（JSON 约束让它没有推理空间，实测同一道题对话模式能算对）。'
        + '建议切回「对话」模式问。任务仍会执行，但结果请自己核对。</div>');
    }
    /* agent 是独立会话，模型看不到页面上的对话。
       用户说"这段代码 / 上面那个 / 刚才的文件"时，把最近几轮当参考带上，
       否则它只能反问（页面是非交互的，反问等于失败）。 */
    var ref = uploadsRef();
    if (/这段|这个|上面|刚才|上次|前面|该代码|该文件|刚才那|继续|接着|再来|再生成|再做|下一个|同上|同样的|那首|那个曲子/.test(task)
        && history.length) {
      var ctx = history.slice(-2).map(function(m){
        var c = String(m.content || "").replace(/\s+/g, " ").slice(0, 400);
        return (m.role === "user" ? "用户: " : "回答: ") + c;
      }).join("\n");
      ref = "【参考上文，只用于理解指代，不要照搬】\n" + ctx + "\n\n【当前任务】\n";
    }
    var bubble = addMsg("bot", '<span class="typing"><i></i><i></i><i></i></span>');
    bubble.classList.add("agent-bubble");
    setBusy(true);
    setTps("");

    fetch("/cgi-bin/agent", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({task: ref + task, max_steps: 5})
    }).then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || "启动失败");
        pollAgent(j.job, bubble, Date.now(), task);
      })
      .catch(function(e){
        bubble.innerHTML = '<span class="err">' + esc(e.message || "启动失败") + '</span>';
        setBusy(false);
      });
  }

  /* 启动自动化插件，两种方式：
   *   daemon=false  前台跑一遍：开气泡、日志实时刷、跑完结束（不常驻）
   *   daemon=true   后台守护：脱离会话常驻，面板显示运行中，随时可停
   * 默认参数用插件自己的（sysmon 前台会自动收敛成有限轮次）。 */
  function runAuto(name, daemon){
    var panel = document.getElementById('envpanel');
    if (panel) panel.classList.remove('show');
    var q = "/cgi-bin/agent?auto=" + encodeURIComponent(name) +
            (daemon ? "&daemon=1" : "") +
            "&args=" + encodeURIComponent("{}");

    if (daemon) {
      /* 后台：不建气泡，只需要一条 toast + 面板状态刷新 */
      fetch(q).then(function(r){ return r.json(); })
        .then(function(j){
          if (j.already) { toast(j.note || "已经在运行了", 4000); }
          else if (!j.ok) { throw new Error(j.error || "启动失败"); }
          else { toast("已在后台守护运行：" + name, 4000); }
          setTimeout(function(){ if (window.refreshEnv) window.refreshEnv(); }, 800);
        })
        .catch(function(e){ toast("启动失败：" + (e.message || ""), 5000); });
      return;
    }

    /* 前台：和普通任务一样的体验，日志实时显示 */
    var bubble = addMsg("bot", '<span class="typing"><i></i><i></i><i></i></span>');
    bubble.classList.add("agent-bubble");
    setBusy(true);
    setTps("");
    fetch(q).then(function(r){ return r.json(); })
      .then(function(j){
        if (j.already) {
          bubble.innerHTML = '<span class="warn">' + esc(j.note || "已经在运行了") + '</span>';
          setBusy(false);
          return;
        }
        if (!j.ok) throw new Error(j.error || "启动失败");
        pollAgent(j.job, bubble, Date.now(), "auto:" + name);
      })
      .catch(function(e){
        bubble.innerHTML = '<span class="err">' + esc(e.message || "启动失败") + '</span>';
        setBusy(false);
      });
  }

  /* 停止：给守护进程发 SIGTERM，插件在当前轮次结束后退出 */
  function stopAuto(name){
    fetch("/cgi-bin/agent?auto_stop=" + encodeURIComponent(name) + "&_=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        toast(j.stopped ? ("已停止：" + name) : (j.note || "没在运行"), 4000);
        /* 状态交给 2 秒轮询去刷，不重建面板（重建会让滚动位置跳） */
      })
      .catch(function(e){ toast("停止失败：" + (e.message || ""), 5000); });
  }

  window.stopAuto = stopAuto;
  window.runAuto = runAuto;     /* 面板那块 <script> 是另一个作用域，得挂出来 */

  function pollAgent(job, bubble, t0, task){
    fetch("/cgi-bin/agent?job=" + encodeURIComponent(job) + "&_=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok){
          bubble.innerHTML = '<span class="err">' + esc(j.error || "任务丢失") + '</span>';
          setBusy(false);
          return;
        }
        bubble.innerHTML = renderAgentLog(j.output || "");
        /* 下载按钮：复制到记事本会因无 BOM 被按 GBK 解码而乱码，
           下载成带 BOM 的 .txt 就不会了 */
        if (!bubble.querySelector(".dl")){
          var dl = document.createElement("button");
          dl.className = "dl";
          dl.textContent = "下载";
          dl.title = "下载为带 BOM 的 UTF-8 文本（记事本打开不乱码）";
          dl.onclick = function(){
            var txt = (j.output || "").replace(/^(任务:|模型:).*\n/gm, "");
            var blob = new Blob(["\ufeff" + txt],
                                {type: "text/plain;charset=utf-8"});
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "agent-" + job + ".txt";
            a.click();
            setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
          };
          bubble.appendChild(dl);
        }
        scrollDown(false);
        var secs = ((Date.now() - t0) / 1000).toFixed(0);
        setTps(j.done ? "完成 " + secs + "s" : "运行中 " + secs + "s");
        if (j.done){
          /* 把这次 agent 往来记进 history。agent 是独立会话（每次新进程），
             不记的话用户再说"继续"或"再来一个"时它完全没有上下文，
             实测会直接傻掉（或者瞎调工具）。 */
          var fin = (j.output || "").match(/最终回答:\s*([\s\S]*?)\n\[统计\]/);
          history.push({role: "user", content: "（Agent 任务）" + (task || "")});
          history.push({role: "assistant",
                        content: fin ? fin[1].trim() : "（已执行，详见步骤卡片）"});
          setBusy(false);
          return;
        }
        setTimeout(function(){ pollAgent(job, bubble, t0, task); }, 1500);
      })
      .catch(function(){
        setTimeout(function(){ pollAgent(job, bubble, t0, task); }, 3000);
      });
  }

  function send(){
    var text = input.value.trim();
    if (!text || busy) return;
    if (MODE === "agent"){ runAgent(text); return; }
    input.value = ""; autosize();
    history.push({role:"user", content:text});
    addMsg("user", render(text, false));

    var bubble = addMsg("bot", '<span class="typing"><i></i><i></i><i></i></span>');

    ctrl = new AbortController();
    setBusy(true);
    setTps("");

    var t0 = 0, nChunks = 0, acc = "";
    var body = {
      messages: [{role:"system", content:SYSTEM}].concat(history.slice(-6)),
      stream: true, max_tokens: 1024, temperature: 0.7, top_p: 0.9,
      /* 0.5B 很容易把同一段代码复读十几遍，默认 repeat_penalty 是 1.0（不惩罚） */
      repeat_penalty: 1.15, repeat_last_n: 256, frequency_penalty: 0.3
    };

    fetch(API + "/v1/chat/completions", {
      method: "POST",
      headers: authHeaders({"Content-Type": "application/json"}),
      body: JSON.stringify(body),
      signal: ctrl.signal
    }).then(function(resp){
      if (resp.status === 401) throw new Error("401");
      if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
      var reader = resp.body.getReader(), dec = new TextDecoder("utf-8"), buf = "";
      function pump(){
        return reader.read().then(function(r){
          if (r.done) return;
          buf += dec.decode(r.value, {stream:true});
          var lines = buf.split("\n");
          buf = lines.pop();
          for (var i = 0; i < lines.length; i++){
            var line = lines[i].trim();
            if (line.indexOf("data:") !== 0) continue;
            var payload = line.slice(5).trim();
            if (payload === "[DONE]") continue;
            var j;
            try { j = JSON.parse(payload); } catch(e){ continue; }
            var d = j.choices && j.choices[0] && j.choices[0].delta;
            var piece = (d && d.content) || "";
            if (piece){
              if (!t0) t0 = performance.now();
              acc += piece; nChunks++;
              bubble.innerHTML = render(acc, false, true) + '<span class="caret"></span>';
              scrollDown(false);
              if (nChunks % 10 === 0 && t0){
                var secs = (performance.now() - t0) / 1000;
                if (secs > 0.5) setTps((nChunks / secs).toFixed(1) + " t/s");
              }
            }
          }
          return pump();
        });
      }
      return pump();
    }).then(function(){
      finish(null);
    }).catch(function(e){
      if (e && e.name === "AbortError") { finish("__stop__"); return; }
      finish(e && e.message ? e.message : "请求失败");
    });

    function finish(err){
      setBusy(false);
      history.push({role:"assistant", content:acc});
      if (acc){
        bubble.innerHTML = render(acc, true);
      } else if (err === "401"){
        bubble.innerHTML = '<span style="color:#f85149">需要访问口令，点右上角钥匙图标输入</span>';
        askKey("服务开启了访问口令，请输入：");
      } else {
        bubble.innerHTML = '<span style="color:#f85149">' +
          (err === "__stop__" ? "已停止" : ("出错：" + err)) + '</span>';
      }
      if (t0 && nChunks){
        var s = (performance.now() - t0) / 1000;
        if (s > 0.5) setTps((acc.length / s).toFixed(1) + " 字/s");
      }
      if (err && err !== "__stop__" && err !== "401"){
        toast(err === "HTTP 503" ? "模型还在加载，稍等再发" : ("请求失败：" + err), 4000);
      }
      ctrl = null;
      scrollDown(false);
      if (!busy) input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  /* 停止：既要 abort 前端轮询，也要**通知后端杀进程**。
     以前只 abort 自己，后端 agent 照跑、.running 一直占着，
     后面所有任务都被"已有任务在跑"挡掉（用户：卡死后停止按钮也没用）。 */
  stopBtn.addEventListener("click", function(){
    fetch("/cgi-bin/agent?stop_job=1&_=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        toast(j.stopped ? "已停止" : "没有在跑的任务", 2500);
        setBusy(false);
      })
      .catch(function(){ toast("停止请求失败", 3000); });
    if (ctrl) ctrl.abort();
    stopBtn.hidden = true;
  });
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
  });
  keyBtn.addEventListener("click", function(){
    if (askKey(storedKey() ? "修改访问口令（留空 = 清除）：" : "服务开通了口令就填这里（留空 = 不用）：")){
      probe._asked = 0; probe._warned = 0;
      probe();
    }
  });
  clearBtn.addEventListener("click", function(){
    if (busy && ctrl) ctrl.abort();
    history = [];
    chat.innerHTML = "";
    setTps("");
    var w = document.createElement("div");
    w.className = "welcome"; w.id = "welcome";
    w.innerHTML = '<h3>对话已清空</h3><span style="font-size:13px">接着问吧</span>';
    chat.appendChild(w);
    input.focus();
  });

  /* ===== 快捷问题：3 个，可自定义，localStorage 持久化 =====
     以前是写死在 HTML 里的，改一次要重刷固件。现在点标题就能改，
     存 localStorage，刷新/重开浏览器都还在。 */
  var QUICK_KEY = "llama_quick_asks";
  var QUICK_DEFAULT = [
    "用一句话解释什么是 NPU",
    "写个 shell 脚本统计日志里 404 的数量",
    "OpenWrt 和一般 Linux 有什么区别？"
  ];

  function loadQuick(){
    try {
      var v = JSON.parse(localStorage.getItem(QUICK_KEY) || "null");
      if (Array.isArray(v) && v.length === 3 &&
          v.every(function(x){ return typeof x === "string" && x.trim().length; }))
        return v;
    } catch (e) {}
    return QUICK_DEFAULT.slice();
  }

  function renderQuick(){
    var box = document.getElementById("quickChips");
    if (!box) return;
    box.innerHTML = loadQuick().map(function(q){
      return '<span class="chip">' + esc(q) + "</span>";
    }).join("");
  }

  function editQuick(){
    var arr = loadQuick();
    var mask = document.createElement("div");
    mask.className = "qask-mask";
    mask.innerHTML =
      '<div class="qask-box">' +
        "<h4>自定义快捷问题</h4>" +
        "<p>固定 3 个，改完一直生效（存在本机浏览器里）</p>" +
        arr.map(function(q, i){
          return '<label>问题 ' + (i+1) + '</label>' +
                 '<input class="qask-in" data-i="' + i + '" value="' + esc(q) + '">';
        }).join("") +
        '<div class="qask-foot">' +
          '<button class="cancel">取消</button>' +
          '<button class="ok">保存</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(mask);

    var ins = mask.querySelectorAll(".qask-in");
    if (ins.length) { ins[0].focus(); ins[0].select(); }

    function close(){ mask.remove(); }
    mask.querySelector(".cancel").addEventListener("click", close);
    mask.addEventListener("click", function(e){ if (e.target === mask) close(); });
    mask.querySelector(".ok").addEventListener("click", function(){
      var out = [];
      for (var i = 0; i < ins.length; i++){
        var v = ins[i].value.trim();
        out.push(v || QUICK_DEFAULT[i]);      /* 空着就用默认值补上，永远保持 3 个 */
      }
      localStorage.setItem(QUICK_KEY, JSON.stringify(out));
      renderQuick();
      close();
    });
    mask.addEventListener("keydown", function(e){
      if (e.key === "Escape") close();
      if (e.key === "Enter") mask.querySelector(".ok").click();
    });
  }

  /* chips 是动态渲染的，用事件委托绑一次 */
  var chipsBox = document.getElementById("quickChips");
  if (chipsBox) chipsBox.addEventListener("click", function(e){
    var c = e.target.closest ? e.target.closest(".chip") : null;
    if (!c) return;
    input.value = c.textContent;
    autosize();
    input.focus();
  });

  var heroTitle = document.getElementById("heroTitle");
  if (heroTitle) heroTitle.addEventListener("click", editQuick);
  renderQuick();

  /* 旧的静态绑定（.chip 现在由上面委托处理，这里保留兼容其他地方的 chip） */
  Array.prototype.forEach.call(document.querySelectorAll(".astep .chip"), function(c){
    c.addEventListener("click", function(){
      input.value = c.textContent;
      autosize();
      input.focus();
    });
  });

  autosize();
  loadConf().then(function(ok){ if (ok) probe(); });
  input.focus();
})();
</script>
<script>
/* 顶部「环境与插件」按钮：点开看环境能力和已加载插件 */
(function(){
  var btn = document.getElementById('envbtn');
  var panel = document.getElementById('envpanel');
  if (!btn || !panel) return;

  /* 这个 <script> 和主脚本是不同作用域，主脚本里的 esc() 在这里看不到，
   * 之前直接用就抛 ReferenceError，被下面的 .catch 吞掉，
   * 现象是"环境两组能显示、插件列表却空白"。这里补一份自己的。 */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* 一组 chip：cls=rt（底层运行时，蓝）/ lib（专用库，紫），缺失=灰 */
  function chips(map, cls){
    var keys = Object.keys(map || {});
    if (!keys.length) return '<span class="grp">（无）</span>';
    var h = '';
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      h += '<span class="chip ' + cls + (map[k] ? '' : ' off') + '"><i></i>' + k + '</span>';
    }
    return h;
  }

  function render(e){
    document.getElementById('envrts').innerHTML = chips(e.runtimes, 'rt');
    document.getElementById('envlibs').innerHTML = chips(e.libs, 'lib');

    var ps = e.plugins || [];
    var box = document.getElementById('envplugs');
    if (!ps.length) {
      box.innerHTML = '<div class="pitem"><b>（无）</b><span>plugins/ 目录里没有 .so</span></div>';
      return;
    }
    var ph = '';
    var nTool = 0, nAuto = 0;
    for (var j = 0; j < ps.length; j++) {
      var p = ps[j];
      var isAuto = (p.kind === 'auto');
      if (isAuto) nAuto++; else nTool++;
      ph += '<div class="pitem' + (isAuto ? ' auto' : '') + '"'
          + (isAuto ? ' data-key="' + esc(p.name) + '"' : '') + '>'
          + '<b>' + esc(p.name) + '</b>'
          + '<span class="pill">' + (isAuto ? '自动化' : '工具') + '</span>';
      if (isAuto && p.triggers) ph += '<span class="trg">' + esc(p.triggers) + '</span>';
      ph += '<span>' + esc(p.desc || '') + '</span>';
      if (isAuto) {
        var running = p.running ? 1 : 0;
        ph += '<div class="astate ' + (running ? 'on' : 'off') + '">'
            + (running ? '● 运行中' + (p.pid ? ' (pid ' + p.pid + ')' : '') : '○ 已停止')
            + '</div>';
        if (running) {
          ph += '<button class="autoact stop" data-name="' + esc(p.name) + '"'
              + ' data-act="stop">停止</button>';
        } else {
          /* 两种运行方式：
           *   运行 = 前台跑一遍，日志实时刷在对话区，跑完就结束
           *   守护 = 后台常驻，面板显示运行中，随时可停 */
          ph += '<button class="autoact" data-name="' + esc(p.name) + '"'
              + ' data-act="run">运行</button>';
          ph += '<button class="autoact bg" data-name="' + esc(p.name) + '"'
              + ' data-act="bg">守护</button>';
        }
      }
      ph += '</div>';
    }
    box.innerHTML = ph;
    /* 点"运行"启动自动化流程，复用任务日志轮询 */
    box.onclick = function(ev){
      var b = ev.target.closest ? ev.target.closest('.autoact') : null;
      if (!b) return;
      ev.stopPropagation();
      var nm = b.getAttribute('data-name');
      var act = b.getAttribute('data-act');
      if (act === 'stop') {
        if (window.stopAuto) window.stopAuto(nm);
      } else if (act === 'bg') {
        if (window.runAuto) window.runAuto(nm, true);    /* 后台守护 */
      } else {
        if (window.runAuto) window.runAuto(nm, false);   /* 前台跑一遍 */
      }
      /* 状态要刷一下，不然按钮文字还是旧的 */
      setTimeout(function(){ if (window.refreshEnv) window.refreshEnv(); }, 1200);
    };
  }

  /* ---- 自动化状态实时刷新 ----
     面板开着的时候每 2 秒拉一次轻量状态（几十字节），只改状态文字和按钮，
     不重建面板 —— 否则滚动位置会跳、按钮会闪。 */
  var autoTimer = null;

  function paintAutoState(name, running, pid){
    var item = document.querySelector('#envplugs .pitem.auto[data-key="' + name + '"]');
    if (!item) return;
    var st = item.querySelector('.astate');
    if (st) {
      st.className = 'astate ' + (running ? 'on' : 'off');
      st.textContent = running
        ? ('● 运行中' + (pid ? ' (pid ' + pid + ')' : ''))
        : '○ 已停止';
    }
    var btn = item.querySelector('.autoact');
    var showingStop = btn && btn.getAttribute('data-act') === 'stop';
    if (showingStop !== !!running) {          /* 状态变了才重建按钮，避免闪烁 */
      var olds = item.querySelectorAll('.autoact');
      for (var k = 0; k < olds.length; k++) olds[k].parentNode.removeChild(olds[k]);
      if (running) {
        item.insertAdjacentHTML('beforeend',
          '<button class="autoact stop" data-name="' + name + '" data-act="stop">停止</button>');
      } else {
        item.insertAdjacentHTML('beforeend',
          '<button class="autoact" data-name="' + name + '" data-act="run">运行</button>'
          + '<button class="autoact bg" data-name="' + name + '" data-act="bg">守护</button>');
      }
    }
  }

  function pollAutoState(){
    var panel = document.getElementById('envpanel');
    if (!panel || !panel.classList.contains('show')) { stopAutoPoll(); return; }
    if (document.hidden) return;              /* 页面在后台就别刷了 */
    fetch('cgi-bin/agent?auto_state=1&_=' + Date.now(), {cache: 'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        (j.auto || []).forEach(function(a){ paintAutoState(a.name, a.running, a.pid); });
      })
      .catch(function(){ /* 网络抖动忽略，下次再刷 */ });
  }

  function startAutoPoll(){
    if (autoTimer) return;
    autoTimer = setInterval(pollAutoState, 2000);
    pollAutoState();
  }

  function stopAutoPoll(){
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  }

  /* 面板显示/隐藏自动接管轮询：开就刷，关就停，不用在每个关闭分支里手动调 */
  if (window.MutationObserver) {
    new MutationObserver(function(){
      if (panel.classList.contains('show')) startAutoPoll();
      else stopAutoPoll();
    }).observe(panel, {attributes: true, attributeFilter: ['class']});
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) pollAutoState();
  });

  window.refreshEnv = load;

  function load(){
    fetch('cgi-bin/agent?env=1', {cache: 'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){ render((d && d.env) || {}); })
      .catch(function(){});
  }

  btn.addEventListener('click', function(ev){
    ev.stopPropagation();
    var open = panel.classList.toggle('show');
    if (open) load();
  });
  document.addEventListener('click', function(ev){
    if (!panel.contains(ev.target) && !btn.contains(ev.target)) {
      panel.classList.remove('show');
    }
  });
  /* 不在这里 load()：页面刷新时不该去探环境（探库要跑子进程，
   * 每刷新一次就烧几秒 CPU）。只在点开面板那一刻查。 */
})();
</script>
<script>
/* 左上角忙闲（问 CGI ?status=1，判据和提交任务时的互斥判断一致，
 * 所以不会出现"显示空闲但提交被拒"） */
(function(){
  var el = document.getElementById('stat');
  if (!el) return;
  function setState(cls, text){
    el.className = 'stat ' + cls;
    el.textContent = text;
  }
  function tick(){
    fetch('cgi-bin/agent?status=1', {cache: 'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) { setState('unknown', '（未知）'); return; }
        if (d.busy) setState('busy', '（忙碌）');
        else setState('idle', '（空闲）');
      })
      .catch(function(){ setState('unknown', '（未知）'); });
  }
  setState('unknown', '（检测中）');
  tick();
  setInterval(tick, 3000);
})();
</script>
</body>
</html>
